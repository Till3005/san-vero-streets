<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="San Vero Streets — an original top-down open-world crime game: drive, shoot, run jobs, outrun the SVPD.">
<title>San Vero Streets</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #12151c; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="San Vero Streets: a top-down open-world crime game. Drive cars, run jobs and outrun the SVPD."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
